[package]
name = "utsim-posto-ui"
description = "Telas egui comuns aos apps UTSim Qualidade e UTSim Segurança do Trabalho: pasta de unidade, postos de trabalho, trabalho em segundo plano"
version.workspace = true
edition.workspace = true
# egui 0.36 needs Rust 1.95.
rust-version = "1.95"

[dependencies]
utsim-posto.workspace = true
utsim-model.workspace = true
utsim-edit.workspace = true
utsim-pasta.workspace = true
utsim-ui-tema = { workspace = true, features = ["abertura", "arquivos"] }
utsim-estudo.workspace = true
utsim-ferramentas.workspace = true
# As cartas de controle desenhadas por `carta`.
utsim-quality.workspace = true
# Pedido e resposta entre os apps (`--utsim-pedido`).
utsim-troca.workspace = true
serde.workspace = true
# Os textos em cinco línguas (idiomas/*/posto.ftl) e o seletor de língua da barra lateral.
utsim-idiomas = { path = "../utsim-idiomas", default-features = false, features = ["egui"] }
serde_json.workspace = true
# The workspace's single egui (the same eframe 0.36.2 of the apps).
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
# Gráficos da tela Ferramentas; a mesma versão dos apps.
egui_plot = { version = "=0.37.0", default-features = false }

[dev-dependencies]
# O caso eq/capacidade do Ensino de ponta a ponta (tests/ensino_capacidade.rs).
utsim-ensino-core = { path = "../utsim-ensino-core" }
utsim-ensino-store = { path = "../utsim-ensino-store" }
tempfile = "=3.27.0"
