[package]
name = "utsim-diario"
description = "Signed journal shared by UTSim Ensino and UTSim LSS: ed25519 keys, hash chain per author, incremental check and detached seals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Crypto versions pinned like the launcher's: any upgrade is a reviewed change.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
getrandom = { version = "=0.2.17", features = ["std"] }

[dev-dependencies]
tempfile = "=3.27.0"
