[package]
name = "utsim-quality"
description = "Quality statistics for UTSim: control charts, process capability and measurement system analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
utsim-stats.workspace = true
serde.workspace = true
rand.workspace = true
rand_distr.workspace = true
rand_pcg.workspace = true
# Reading .xlsx sheets (data::xlsx): the same zip as the other crates.
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = { version = "=0.102.0", default-features = false }
