[package]
name = "utsim-troca"
description = "Pedido e resposta entre os apps da família UTSim (seção 2 de docs/plano_integracao_familia.md): arquivos JSON com hash, argumentos de linha de comando e busca do programa, sem interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Chaves das ferramentas (`importar::chave` e `de_chave`), as mesmas dos argumentos diretos.
utsim-estudo.workspace = true
# Gravação atômica do pedido e da resposta numa pasta sincronizada.
utsim-pasta.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "=3.27.0"
