[package]
name = "utsim-ferramentas"
description = "Ferramentas de solução de problemas comuns aos apps da família (FMEA com a tabela de AP, Ishikawa, 5 porquês, planos de controle e de reação, A3, Pareto, QFD, poka-yoke, seleção de soluções, 5S, SMED, trabalho padronizado, gerador de relatórios em PDF e CSV), sem estado de projeto e sem interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The on-screen names and findings in five languages (idiomas/*/ferramentas.ftl), without egui.
utsim-idiomas = { path = "../utsim-idiomas", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
