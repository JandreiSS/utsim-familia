[package]
name = "utsim-model"
description = "Model file format (RON) and replication runner for UTSim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
utsim-core.workspace = true
utsim-objects.workspace = true
utsim-flow.workspace = true
utsim-script.workspace = true
serde.workspace = true
ron.workspace = true
rayon = { workspace = true, optional = true }
thiserror.workspace = true

[features]
# Replications run on rayon threads; disable for WebAssembly (sequential, same results).
default = ["parallel"]
parallel = ["dep:rayon"]

[dev-dependencies]
serde_json.workspace = true
