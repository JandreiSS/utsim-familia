[package]
name = "utsim-lss-store"
description = "Project folder of UTSim Seis Sigma: write-once operation journal, snapshots, presence, attachments, local cache and .lssz export, safe in a synced folder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "utsim_lss_store"
path = "src/lib.rs"

[dependencies]
utsim-lss-core = { path = "../utsim-lss-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
getrandom = { version = "=0.2.17", features = ["std"] }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
# Local UTC offset for "today" (the same chrono already in Cargo.lock; clock feature only).
# The .xlsx of the reports (the same pinned version as the dashboard).
rust_xlsxwriter = { version = "=0.102.0", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "=3.27.0"
