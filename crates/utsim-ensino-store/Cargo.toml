[package]
name = "utsim-ensino-store"
description = "UTSim Ensino storage: packages (.utse), signed attempt journal, deliveries (.utsr), invitations (.utsc), class folder and batch grading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
utsim-ensino-core = { path = "../utsim-ensino-core" }
utsim-model.workspace = true
# The training project of the Lean Six Sigma case for UTSim Seis Sigma (act 8).
utsim-lss-core = { path = "../utsim-lss-core" }
utsim-lss-store = { path = "../utsim-lss-store" }
serde.workspace = true
serde_json.workspace = true
# "Ver em 3D": the UTSim client installed by the launcher.
utsim-launcher-core = { path = "../utsim-launcher-core" }
ron.workspace = true
thiserror.workspace = true
rayon.workspace = true
# Keys, signatures and the hash chain, shared with UTSim Seis Sigma (decision E12).
utsim-diario.workspace = true
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
# The class grades as a spreadsheet (the same writer as the Seis Sigma reports).
rust_xlsxwriter = { version = "=0.102.0", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
utsim-quality.workspace = true
