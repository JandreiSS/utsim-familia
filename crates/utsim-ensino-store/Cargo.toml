[package]
name = "utsim-ensino-store"
description = "UTSim Ensino storage: packages (.utse), signed attempt journal, deliveries (.utsr), invitations (.utsc), class folder and batch grading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
utsim-ensino-core = { path = "../utsim-ensino-core" }
utsim-model.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
thiserror.workspace = true
rayon.workspace = true
# Crypto versions pinned like the launcher's: any upgrade is a reviewed change.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
getrandom = { version = "=0.2.17", features = ["std"] }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
# The class grades as a spreadsheet (the same writer as the Seis Sigma reports).
rust_xlsxwriter = { version = "=0.102.0", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
