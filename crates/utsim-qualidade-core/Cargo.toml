[package]
name = "utsim-qualidade-core"
description = "Indicadores de qualidade da simulação (rendimentos, DPMO, escape, Pareto, capacidade da característica simulada) e relatório HTML, base do app UTSim Qualidade (sem interface)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
utsim-core.workspace = true
utsim-model.workspace = true
utsim-quality.workspace = true
utsim-stats.workspace = true
utsim-ferramentas.workspace = true
utsim-estudo.workspace = true
# 8D sent to the Seis Sigma portfolio (QS13).
utsim-lss-core = { path = "../utsim-lss-core" }
utsim-lss-store = { path = "../utsim-lss-store" }
serde_json.workspace = true
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
serde.workspace = true
# Names of categories and origins in the language now (the keys of `idiomas/<código>/qualidade.ftl`).
utsim-idiomas = { path = "../utsim-idiomas", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
