[package]
name = "utsim-launcher-core"
description = "Core of the UTSim family launcher: signed manifest, encrypted packages, resumable downloads, installation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "utsim_launcher_core"
path = "src/lib.rs"

# Crypto versions are pinned on purpose: any upgrade is a reviewed change.
[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
getrandom = { version = "=0.2.17", features = ["std"] }
zeroize = { version = "=1.8.2", features = ["derive"] }
base64 = "=0.22.1"
hex = "=0.4.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
