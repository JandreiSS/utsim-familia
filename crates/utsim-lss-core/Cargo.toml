[package]
name = "utsim-lss-core"
description = "Domain of UTSim Seis Sigma (Lean Six Sigma projects): entities, operation journal in Lamport order, conflicts and the project format"
# Own version and tag (`lss-v<version>`), apart from the simulator (docs/plano_lean_seis_sigma.md, R1).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "utsim_lss_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Frozen hash of the deliverables at a tollgate decision (the same sha2 as the store).
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
# Schedule: CPM, classic PERT and Monte Carlo come from the simulator's PERT crate (plan 1.6).
utsim-pert.workspace = true
utsim-core.workspace = true
# Expected answers of the practical problems and the teaching data sets (plan 8.5 and 8.6).
utsim-stats.workspace = true
utsim-quality.workspace = true

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
