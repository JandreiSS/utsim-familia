[package]
name = "utsim-ensino-ui"
description = "UTSim Ensino screens in egui, without a backend: campaign map, mission, 2D view, results, sandbox, class and teacher panel"
version.workspace = true
edition.workspace = true
# egui 0.36 needs Rust 1.95.
rust-version = "1.95"

[dependencies]
utsim-ensino-core = { path = "../utsim-ensino-core" }
utsim-ensino-store = { path = "../utsim-ensino-store" }
# The texts of the screens in the five languages (`idiomas/<código>/ensino.ftl`).
utsim-idiomas.workspace = true
# The clock and the program folder of UTSim Seis Sigma (competences of the solved missions).
utsim-lss-store = { path = "../utsim-lss-store" }
utsim-core.workspace = true
utsim-model.workspace = true
utsim-ui-tema = { workspace = true, features = ["abertura", "arquivos"] }
ron.workspace = true
# The workspace's single egui, no backend: the host (the eframe app now, the Godot bridge
# later) gives the window and a task executor.
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
tempfile = "=3.27.0"
# Headless pictures of the screens (`tests/capturas.rs`).
utsim-ui-tema = { workspace = true, features = ["captura"] }
