[workspace]
resolver = "3"
members = ["crates/*"]
# The Python bindings need a Python toolchain: built on their own (crates/utsim-py).
exclude = ["crates/utsim-py", "tools/icone"]
# The 3D viewer pulls in Bevy (slow to build): it is opt-in (`-p utsim-viewer`). The Godot
# bridge (`-p utsim-godot`, a GDExtension library) is opt-in too: `scripts/godot.sh`. The
# windowed apps (`utsim-launcher`, `utsim-lss-app`, `utsim-ensino-app`, `utsim-qualidade-app`, `utsim-estatistica-app`,
# `utsim-seguranca-app`, `utsim-produto-app`, `utsim-posto-ui`) build with `-p` or `--workspace`.
default-members = [
    "crates/utsim-assets",
    "crates/utsim-cad",
    "crates/utsim-cli",
    "crates/utsim-core",
    "crates/utsim-dash",
    "crates/utsim-doe",
    "crates/utsim-diagram",
    "crates/utsim-diario",
    "crates/utsim-edit",
    "crates/utsim-ensino-core",
    "crates/utsim-ensino-store",
    "crates/utsim-exposicao",
    "crates/utsim-ferramentas",
    "crates/utsim-env",
    "crates/utsim-estudo",
    "crates/utsim-fit",
    "crates/utsim-flow",
    "crates/utsim-fluid",
    "crates/utsim-idiomas",
    "crates/utsim-linhas",
    "crates/utsim-look",
    "crates/utsim-lss-core",
    "crates/utsim-lss-store",
    "crates/utsim-model",
    "crates/utsim-nav",
    "crates/utsim-objects",
    "crates/utsim-opt",
    "crates/utsim-pasta",
    "crates/utsim-pert",
    "crates/utsim-posto",
    "crates/utsim-produto-core",
    "crates/utsim-quality",
    "crates/utsim-qualidade-core",
    "crates/utsim-scene",
    "crates/utsim-script",
    "crates/utsim-seguranca-core",
    "crates/utsim-stats",
    "crates/utsim-troca",
    "crates/utsim-twin",
    "crates/utsim-ui-tema",
    "crates/utsim-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/jandreiss/utsim"

[workspace.dependencies]
utsim-core = { path = "crates/utsim-core" }
utsim-objects = { path = "crates/utsim-objects" }
utsim-model = { path = "crates/utsim-model" }
utsim-fit = { path = "crates/utsim-fit" }
utsim-stats = { path = "crates/utsim-stats" }
utsim-quality = { path = "crates/utsim-quality" }
utsim-qualidade-core = { path = "crates/utsim-qualidade-core" }
utsim-edit = { path = "crates/utsim-edit" }
utsim-script = { path = "crates/utsim-script" }
utsim-seguranca-core = { path = "crates/utsim-seguranca-core" }
utsim-flow = { path = "crates/utsim-flow" }
utsim-fluid = { path = "crates/utsim-fluid" }
utsim-opt = { path = "crates/utsim-opt" }
utsim-pert = { path = "crates/utsim-pert" }
utsim-posto = { path = "crates/utsim-posto" }
utsim-estudo = { path = "crates/utsim-estudo" }
utsim-pasta = { path = "crates/utsim-pasta" }
utsim-troca = { path = "crates/utsim-troca" }
utsim-posto-ui = { path = "crates/utsim-posto-ui" }
utsim-env = { path = "crates/utsim-env" }
utsim-emu = { path = "crates/utsim-emu" }
utsim-web = { path = "crates/utsim-web" }
utsim-scene = { path = "crates/utsim-scene" }
utsim-assets = { path = "crates/utsim-assets" }
utsim-look = { path = "crates/utsim-look" }
utsim-cad = { path = "crates/utsim-cad" }
utsim-doe = { path = "crates/utsim-doe" }
utsim-diagram = { path = "crates/utsim-diagram" }
utsim-dash = { path = "crates/utsim-dash" }
utsim-nav = { path = "crates/utsim-nav" }
utsim-exposicao = { path = "crates/utsim-exposicao" }
utsim-ferramentas = { path = "crates/utsim-ferramentas" }
utsim-twin = { path = "crates/utsim-twin" }
utsim-ui-tema = { path = "crates/utsim-ui-tema" }
utsim-linhas = { path = "crates/utsim-linhas" }
utsim-diario = { path = "crates/utsim-diario" }
utsim-idiomas = { path = "crates/utsim-idiomas" }
utsim-produto-core = { path = "crates/utsim-produto-core" }

rand = { version = "0.9", default-features = false, features = ["std"] }
rand_distr = { version = "0.5", default-features = false, features = ["std"] }
rand_pcg = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
slotmap = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rayon = "1"
wasm-bindgen = "0.2"
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_time", "no_module"] }

# Numeric crates are optimised even in debug builds: the statistical tests
# (bootstrap, replications) would otherwise take minutes.
# Debug builds keep only line tables (backtraces still show file and line) and no debug info
# for dependencies: several worktrees build at once and full debug info filled the disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.utsim-core]
opt-level = 2

[profile.dev.package.utsim-fit]
opt-level = 2

[profile.dev.package.utsim-stats]
opt-level = 2

[profile.dev.package.utsim-quality]
opt-level = 2

[profile.release]
debug = "line-tables-only"

# Size-optimised build of the browser module (`scripts/web.sh`).
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
panic = "abort"
# Drops the wasm `name` section (29 MB of the 65 MB 3D viewer module).
strip = "symbols"

# The 3D viewer for the browser. Full LTO with one codegen unit over Bevy needs more
# memory and time than CI runners have (the job was killed after 25 min), so it uses
# thin LTO (about 5 min here, 44 MB); the small engine module keeps the `web` profile.
[profile.web-3d]
inherits = "web"
lto = "thin"
codegen-units = 1
