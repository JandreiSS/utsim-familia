name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (verificação completa, com golden)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rodar scripts/verificar.ps1
        shell: powershell
        run: ./scripts/verificar.ps1

  ubuntu:
    name: Linux (portabilidade, sem golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Testes sem golden
        run: cargo test --workspace -- --skip golden
