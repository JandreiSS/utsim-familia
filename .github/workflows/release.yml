name: Release

# Publica os pacotes do UTSim (instalador do Windows, .deb e .tar.gz do Linux, .zip do Windows e
# a página web) em uma Release do GitHub ao empurrar uma tag como v0.1.0. As notas vêm da seção
# correspondente do CHANGELOG.md (scripts/notas-versao.sh).
#
# Simulação (dry run): Actions > Release > Run workflow. Constrói tudo e guarda os arquivos como
# artefatos da execução, sem criar tag nem Release. Serve para testar antes de empacotar de verdade.
# Só por disparo manual, para não gastar minutos sem necessidade. Para publicar uma versão,
# dispare na tag: `gh workflow run Release --ref v0.2.0`.
on:
  workflow_dispatch:
    inputs:
      incluir_3d:
        description: "Incluir o UTSim 3D (prévia, em Godot) nos pacotes (baixa ~1 GB de modelos de exportação)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # O UTSim 3D (prévia) entra nos pacotes ao disparar à mão com "incluir_3d", ou sempre se a
  # variável do repositório UTSIM_INCLUIR_3D for "true" (Settings > Variables).
  INCLUIR_3D: ${{ inputs.incluir_3d == true || vars.UTSIM_INCLUIR_3D == 'true' }}

jobs:
  versao:
    name: Versão
    runs-on: ubuntu-latest
    outputs:
      rotulo: ${{ steps.v.outputs.rotulo }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          cargo_versao=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            rotulo=$GITHUB_REF_NAME
            base=${rotulo#v}
            base=${base%%-*}
            if [ "$base" != "$cargo_versao" ]; then
              echo "A tag $rotulo não bate com a versão $cargo_versao de Cargo.toml" >&2
              exit 1
            fi
            publicar=sim
          else
            rotulo=v${cargo_versao}-teste
            publicar=nao
          fi
          echo "rotulo=$rotulo" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
          echo "Versão dos pacotes: $rotulo (publicar: $publicar)"

  linux:
    name: Linux x64 (.deb e .tar.gz)
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Bevy no Linux
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        run: cargo build --release -p utsim-cli -p utsim-viewer
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Manual em HTML (se falhar, o pacote leva o Markdown)
        continue-on-error: true
        run: mdbook build docs/manual
      - name: UTSim 3D (prévia), exportação do Godot para o Linux
        if: env.INCLUIR_3D == 'true'
        run: |
          sudo apt-get install -y libfontconfig1 libxcursor1 libxi6 libxinerama1 libxrandr2 libgl1
          bash scripts/godot_instalar_ci.sh linux "$RUNNER_TEMP/godot"
          bash scripts/godot_exportar.sh --instalar-modelos
      - name: Empacotar (.tar.gz e .deb)
        run: bash scripts/pacotes-linux.sh "${{ needs.versao.outputs.rotulo }}" dist
      - name: Conferir o conteúdo do .deb
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | head -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  windows:
    name: Windows x64 (instalador e .zip)
    needs: versao
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar (o build.rs embute o ícone nos .exe)
        run: cargo build --release -p utsim-cli -p utsim-viewer
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Manual em HTML (se falhar, o pacote leva o Markdown)
        continue-on-error: true
        shell: bash
        run: mdbook build docs/manual
      - name: UTSim 3D (prévia), exportação do Godot para o Windows
        if: env.INCLUIR_3D == 'true'
        shell: bash
        run: |
          bash scripts/godot_instalar_ci.sh windows "$RUNNER_TEMP/godot"
          bash scripts/godot_exportar.sh --instalar-modelos
      - name: NSIS
        shell: powershell
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
      - name: Gerar o instalador
        shell: bash
        run: bash scripts/instalador-windows.sh "${{ needs.versao.outputs.rotulo }}" dist
      - name: Gerar o .zip (versão portátil)
        shell: bash
        run: |
          nome=utsim-${{ needs.versao.outputs.rotulo }}-windows-x64
          bash scripts/preparar-pacote.sh "pacote/$nome" target/release target/godot-export/windows
          (cd pacote && 7z a "../dist/$nome.zip" "$nome")
      - name: Conteúdo do instalador (lista dos arquivos)
        shell: bash
        run: 7z l dist/*instalador.exe | head -n 60
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-windows
          path: |
            dist/*.exe
            dist/*.zip

  web:
    name: Página web
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Construir a página e o visualizador 3D (scripts/web.sh instala o wasm-bindgen-cli)
        run: bash scripts/web.sh
      - name: Empacotar
        run: |
          name=utsim-${{ needs.versao.outputs.rotulo }}-web
          mkdir "$name"
          cp -r web/dist/. "$name"/
          cp README.md "$name"/
          cp -r examples "$name"/examples
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-web
          path: "*.zip"

  publicar:
    name: Publicar a Release
    needs: [versao, linux, windows, web]
    if: needs.versao.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: Somas de verificação e notas da versão
        run: |
          (cd pacotes && sha256sum * > SHA256SUMS.txt)
          bash scripts/notas-versao.sh "$GITHUB_REF_NAME" > notas.md
          ls -l pacotes
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          body_path: notas.md
          prerelease: ${{ contains(github.ref_name, '-') }}
