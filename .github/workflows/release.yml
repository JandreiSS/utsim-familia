name: Release

# Publica binários e a página web ao empurrar uma tag como v0.1.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Bevy no Linux
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        run: cargo build --release -p utsim-cli -p utsim-viewer
      - name: Empacotar
        run: |
          name=utsim-${GITHUB_REF_NAME}-linux-x64
          mkdir "$name"
          cp target/release/utsim target/release/utsim-view LICENSE README.md "$name"/
          cp -r examples "$name"/examples
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-linux
          path: "*.tar.gz"

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        run: cargo build --release -p utsim-cli -p utsim-viewer
      - name: Empacotar
        shell: bash
        run: |
          name=utsim-${GITHUB_REF_NAME}-windows-x64
          mkdir "$name"
          cp target/release/utsim.exe target/release/utsim-view.exe LICENSE README.md "$name"/
          cp -r examples "$name"/examples
          7z a "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-windows
          path: "*.zip"

  web:
    name: Página web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Construir a página e o visualizador 3D (scripts/web.sh instala o wasm-bindgen-cli)
        run: bash scripts/web.sh
      - name: Empacotar
        run: |
          name=utsim-${GITHUB_REF_NAME}-web
          mkdir "$name"
          cp -r web/dist/. "$name"/
          cp LICENSE README.md "$name"/
          cp -r examples "$name"/examples
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-web
          path: "*.zip"

  publicar:
    name: Publicar a Release
    needs: [linux, windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          generate_release_notes: true
